<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sloppy PDF Viewer</title>
  <link rel="stylesheet" href="pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <div id="toolbarLeft">
      <button id="sidebarToggle" class="toolbar-btn" title="Toggle Sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2h4v12H2zm6 0h6v12H8z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <div class="separator"></div>
      <button id="viewFind" class="toolbar-btn" title="Find in Document (Ctrl+F)">
        <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="9.5" y1="9.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="separator"></div>
      <button id="previous" class="toolbar-btn" title="Previous Page">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 13L4 8l8-5z" fill="currentColor"/></svg>
      </button>
      <span class="page-nav">
        <input id="pageNumber" type="number" min="1" value="1">
        <span>/ <span id="numPages">0</span></span>
      </span>
      <button id="next" class="toolbar-btn" title="Next Page">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 3l8 5-8 5z" fill="currentColor"/></svg>
      </button>
    </div>

    <div id="toolbarCenter">
      <button id="zoomOut" class="toolbar-btn" title="Zoom Out (Ctrl+-)">
        <svg width="16" height="16" viewBox="0 0 16 16"><line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <select id="scaleSelect" title="Zoom">
        <option value="auto">Automatic Zoom</option>
        <option value="page-fit">Page Fit</option>
        <option value="page-width">Page Width</option>
        <option value="page-actual">Actual Size</option>
        <option value="custom" disabled hidden></option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5" selected>150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
      <button id="zoomIn" class="toolbar-btn" title="Zoom In (Ctrl+=)">
        <svg width="16" height="16" viewBox="0 0 16 16"><line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="3" x2="8" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="toolbarRight">
      <button id="presentationMode" class="toolbar-btn" title="Presentation Mode">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="3" width="14" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.5l4.5 2.5L6 11.5z" fill="currentColor"/></svg>
      </button>
      <button id="openFile" class="toolbar-btn" title="Open File (Ctrl+O)">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 14V4h4l2 2h6v8z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button id="download" class="toolbar-btn" title="Save (Ctrl+S)">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2v8M4 7l4 4 4-4M3 13h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="separator"></div>
      <div id="secondaryToolbarWrapper">
        <button id="secondaryToolbarToggle" class="toolbar-btn" title="Tools">
          <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></svg>
        </button>
        <div id="secondaryToolbar" class="hidden">
          <button id="firstPage" class="menu-item">
            <span class="label">Go to First Page</span>
            <span class="shortcut">Home</span>
          </button>
          <button id="lastPage" class="menu-item">
            <span class="label">Go to Last Page</span>
            <span class="shortcut">End</span>
          </button>
          <div class="menu-separator"></div>
          <button id="pageRotateCw" class="menu-item">
            <span class="label">Rotate Clockwise</span>
            <span class="shortcut">R</span>
          </button>
          <button id="pageRotateCcw" class="menu-item">
            <span class="label">Rotate Counter-Clockwise</span>
            <span class="shortcut">Shift+R</span>
          </button>
          <div class="menu-separator"></div>
          <button id="cursorSelectTool" class="menu-item toggled">
            <span class="label">Text Selection Tool</span>
          </button>
          <button id="cursorHandTool" class="menu-item">
            <span class="label">Hand Tool</span>
          </button>
          <div class="menu-separator"></div>
          <button id="scrollVertical" class="menu-item toggled">
            <span class="label">Vertical Scrolling</span>
          </button>
          <button id="scrollHorizontal" class="menu-item">
            <span class="label">Horizontal Scrolling</span>
          </button>
          <button id="scrollWrapped" class="menu-item">
            <span class="label">Wrapped Scrolling</span>
          </button>
          <div class="menu-separator"></div>
          <button id="spreadNone" class="menu-item toggled">
            <span class="label">No Spreads</span>
          </button>
          <button id="spreadOdd" class="menu-item">
            <span class="label">Odd Spreads</span>
          </button>
          <button id="spreadEven" class="menu-item">
            <span class="label">Even Spreads</span>
          </button>
          <div class="menu-separator"></div>
          <button id="documentProperties" class="menu-item">
            <span class="label">Document Properties…</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Find Bar -->
  <div id="findbar" class="hidden">
    <input id="findInput" type="text" placeholder="Find in document…">
    <button id="findPrevious" class="toolbar-btn" title="Previous Match (Shift+Enter)">
      <svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="findNext" class="toolbar-btn" title="Next Match (Enter)">
      <svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="separator"></div>
    <label class="find-option"><input type="checkbox" id="findHighlightAll"> Highlight All</label>
    <label class="find-option"><input type="checkbox" id="findMatchCase"> Match Case</label>
    <label class="find-option"><input type="checkbox" id="findEntireWord"> Whole Words</label>
    <label class="find-option"><input type="checkbox" id="findMatchDiacritics"> Match Diacritics</label>
    <span id="findResultsCount"></span>
    <span id="findMsg"></span>
    <div class="spacer"></div>
    <button id="findClose" class="toolbar-btn" title="Close (Escape)">
      <svg width="14" height="14" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Main container: sidebar + viewer -->
  <div id="mainContainer">
    <div id="sidebar" class="hidden">
      <div id="sidebarTabs">
        <button id="tabThumbnails" class="sidebar-tab active" title="Thumbnails">
          <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="1" width="5" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1" width="5" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="9" width="5" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="9" width="5" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="tabOutline" class="sidebar-tab" title="Document Outline">
          <svg width="16" height="16" viewBox="0 0 16 16"><line x1="3" y1="3" x2="13" y2="3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="5" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="5" y1="11" x2="13" y2="11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="sidebarContent">
        <div id="thumbnailView" class="sidebar-panel"></div>
        <div id="outlineView" class="sidebar-panel hidden"></div>
      </div>
    </div>

    <div id="viewerWrapper">
      <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
      </div>
    </div>
  </div>

  <!-- Document Properties Dialog -->
  <div id="propertiesOverlay" class="dialog-overlay hidden">
    <div id="propertiesDialog" class="dialog">
      <h3>Document Properties</h3>
      <table id="propertiesTable">
        <tr><td>File Name:</td><td id="propFileName">-</td></tr>
        <tr><td>File Size:</td><td id="propFileSize">-</td></tr>
        <tr><td>Title:</td><td id="propTitle">-</td></tr>
        <tr><td>Author:</td><td id="propAuthor">-</td></tr>
        <tr><td>Subject:</td><td id="propSubject">-</td></tr>
        <tr><td>Keywords:</td><td id="propKeywords">-</td></tr>
        <tr><td>Creation Date:</td><td id="propCreationDate">-</td></tr>
        <tr><td>Modification Date:</td><td id="propModDate">-</td></tr>
        <tr><td>Creator:</td><td id="propCreator">-</td></tr>
        <tr><td>PDF Producer:</td><td id="propProducer">-</td></tr>
        <tr><td>PDF Version:</td><td id="propVersion">-</td></tr>
        <tr><td>Page Count:</td><td id="propPageCount">-</td></tr>
        <tr><td>Page Size:</td><td id="propPageSize">-</td></tr>
        <tr><td>Linearized:</td><td id="propLinearized">-</td></tr>
      </table>
      <div class="dialog-buttons">
        <button id="propertiesClose">Close</button>
      </div>
    </div>
  </div>

  <!-- Drop Overlay -->
  <div id="dropOverlay">Drop PDF here</div>

  <script src="pdfjs/pdf.min.mjs" type="module"></script>
  <script src="main.js" type="module"></script>
</body>
</html>
